# Nginx reverse proxy → Next.js (port 3011)
# วางไว้ที่ /etc/nginx/sites-available/minimalcnx.conf แล้ว symlink ไป sites-enabled

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name your-domain.com;   # << แก้เป็นโดเมนจริง

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Cloudflare ส่ง IP จริงใน CF-Connecting-IP — ต้อง forward ให้ Next.js บันทึก audit
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        # ป้องกัน 502 เมื่อ Node.js ตัด Keep-Alive Socket หรือ Container กำลังรีสตาร์ท
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # ป้องกัน 502 จาก 'upstream sent too big header' เมื่อ Supabase/Next.js ส่ง Header/Cookie ขนาดใหญ่
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # เพิ่ม Timeout ให้ Nginx รอนานขึ้น รองรับ Cold-start ของ Next.js
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

